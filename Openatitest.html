<!DOCTYPE html>
<html>
<head>
  <title>AI Score Test</title>

  <style>
    body {
      font-family: Arial;
      padding: 40px;
      max-width: 600px;
      margin: auto;
    }

    textarea {
      width: 100%;
      height: 90px;
      margin-bottom: 20px;
      padding: 10px;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      margin-top: 25px;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h2>🧠 AI Score Test</h2>

<label>Rigtigt svar</label>
<textarea id="correct"></textarea>

<label>Spillers bud</label>
<textarea id="guess"></textarea>

<button id="runBtn">Beregn score</button>

<div id="result"></div>

<script>

// 🔴 INDSÆT DIN API KEY HER
const API_KEY = "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";


async function calculateScore(){

  const correct = document.getElementById("correct").value;
  const guess = document.getElementById("guess").value;

  document.getElementById("result").innerText = "Beregner...";

  try {

    const response = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + API_KEY
      },
      body: JSON.stringify({
        model: "gpt-4o-mini",
        messages: [
          {
            role: "user",
            content: `
Du er dommer i et spil.

Fasit:
"${correct}"

Spillerens svar:
"${guess}"

Giv en score fra 0 til 100 baseret på hvor tæt svaret er.

Svar KUN med et tal.
`
          }
        ],
        max_tokens: 10
      })
    });

    const data = await response.json();

    console.log("AI svar:", data);

    // ✅ robust parsing
    const text = data.choices?.[0]?.message?.content || "";
    const match = text.match(/\d+/);

    const score = match ? parseInt(match[0]) : 50;

    document.getElementById("result").innerText = "Score: " + score;

  } catch (err) {

    console.error(err);
    document.getElementById("result").innerText = 
      "❌ Fejl – åbner du filen via file:// ? Brug localhost";

  }
}


// ✅ FIX til din tidligere fejl
document.getElementById("runBtn").addEventListener("click", calculateScore);

</script>

</body>
</html>
