<!DOCTYPE html>
<html>
<head>
  <title>Prompt & Grimasser</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 1000px;
    }

    h2 {
      margin-bottom: 8px;
    }

    .layout {
      display: grid;
      grid-template-columns: 460px 1fr;
      gap: 28px;
      align-items: start;
    }

    .gallery {
      margin-top: 10px;
    }

    .main-image {
      width: 100%;
      max-width: 440px;
      border: 3px solid #d0d0d0;
      display: block;
    }

    .thumbs {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .thumb {
      width: 70px;
      height: 70px;
      object-fit: cover;
      cursor: pointer;
      border: 3px solid transparent;
      box-sizing: border-box;
    }

    .thumb.active {
      border: 3px solid black;
    }

    .avatar-box {
      width: 128px;
      height: 128px;
      border: 2px dashed #ccc;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f8f8;
      margin-bottom: 8px;
    }

    .avatar-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
